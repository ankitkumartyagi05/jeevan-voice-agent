[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jeevan"
version = "2.0.0"
description = "JEEVAN - Personal AI Desktop Operating Agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "JEEVAN AI Architecture Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0"
]

[project.scripts]
jeevan = "main:main"
